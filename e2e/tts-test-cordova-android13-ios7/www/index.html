<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TTS E2E Test</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .test { padding: 10px; margin: 5px 0; border-radius: 5px; }
        .pass { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
        .running { background: #fff3cd; color: #856404; }
        button { padding: 10px 20px; margin: 10px 5px 10px 0; font-size: 16px; }
        #status { font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>TTS E2E Tests</h1>
    <div id="status">Waiting for device...</div>
    <button id="runTests">Run Tests</button>
    <button id="testSpeak">Test Speak</button>
    <div id="results"></div>

    <script type="text/javascript" src="cordova.js"></script>
    <script type="text/javascript" src="js/tests.js"></script>
</body>
</html>
